[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeroday-research-lab"
version = "0.1.0"
description = "A comprehensive defensive vulnerability research and fuzzing platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zero-Day Research Lab Contributors"},
]
keywords = ["fuzzing", "security", "vulnerability", "research", "AFL", "sanitizers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pyelftools>=0.29",
    "dataclasses-json>=0.5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "hypothesis>=6.82.0",
]

[project.scripts]
zerodaylab = "zerodaylab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zerodaylab"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow tests",
    "requires_afl: requires AFL++ to be installed",
    "requires_clang: requires Clang to be installed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
