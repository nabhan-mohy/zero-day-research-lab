[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmcs"
version = "0.1.0"
description = "Keyless Memory-Corruption Scanner - a defensive fuzzing and memory-safety research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KMCS Project" }]
keywords = ["security", "fuzzing", "memory-safety", "sanitizers", "afl"]

dependencies = [
    "pydantic>=2.6,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
kmcs = "kmcs.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:kmcs.*"]
